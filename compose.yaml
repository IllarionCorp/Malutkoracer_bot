services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: booking_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking_bot}
      POSTGRES_DB: booking_bot
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_bot -d booking_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
